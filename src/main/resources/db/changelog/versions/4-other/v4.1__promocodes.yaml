databaseChangeLog:
  - changeSet:
      id: create-promocodes-table
      author: dev
      changes:
        - createTable:
            tableName: promocodes
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: discount_value
                  type: DECIMAL(5,2)
                  constraints:
                    nullable: false
              - column:
                  name: expiry_date
                  type: TIMESTAMP
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValue: "true"
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
  - changeSet:
      id: alter-promocodes-table
      author: dev
      changes:
        - addColumn:
            tableName: promocodes
            columns:
              - column:
                  name: discount_type
                  type: VARCHAR(20)
              - column:
                  name: usage_limit
                  type: INTEGER
              - column:
                  name: times_used
                  type: INTEGER
                  defaultValue: 0
              - column:
                  name: description
                  type: VARCHAR(1000)