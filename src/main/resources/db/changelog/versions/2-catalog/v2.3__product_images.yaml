databaseChangeLog:
  - changeSet:
      id: create-product-images-table
      author: dev
      preConditions:
        - tableExists:
            tableName: products
      changes:
        - createTable:
            tableName: product_images
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: product_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: image_url
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
              - column:
                  name: is_primary
                  type: BOOLEAN
                  defaultValue: false

        - addForeignKeyConstraint:
            baseTableName: product_images
            baseColumnNames: product_id
            constraintName: fk_product_image_product
            referencedTableName: products
            referencedColumnNames: id