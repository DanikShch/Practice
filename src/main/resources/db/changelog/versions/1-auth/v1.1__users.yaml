databaseChangeLog:
  - changeSet:
      id: create-users-table
      author: dev
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: users
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(20)
                  defaultValue: "CUSTOMER"
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
  - changeSet:
      id: add-password-reset-columns
      author: dev
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: reset_token
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: reset_token_expiry
                  type: TIMESTAMP
                  constraints:
                    nullable: true
  - changeSet:
      id: drop-reset-token-columns
      author: dev
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: users
            columnName: reset_token
      changes:
        - dropColumn:
            tableName: users
            columnName: reset_token

  - changeSet:
      id: drop-reset-token-expiry-column
      author: dev
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: users
            columnName: reset_token_expiry
      changes:
        - dropColumn:
            tableName: users
            columnName: reset_token_expiry
