databaseChangeLog:
  - changeSet:
      id: create-carts-table
      author: dev
      preConditions:
        - tableExists:
            tableName: users
      changes:
        - createTable:
            tableName: carts
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

        - addForeignKeyConstraint:
            baseTableName: carts
            baseColumnNames: user_id
            constraintName: fk_cart_user
            referencedTableName: users
            referencedColumnNames: id

  - changeSet:
      id: create-cart-items-table
      author: dev
      preConditions:
        - tableExists:
            tableName: products
        - tableExists:
            tableName: carts
      changes:
        - createTable:
            tableName: cart_items
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
              - column:
                  name: cart_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INTEGER
                  defaultValue: "1"
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: cart_items
            baseColumnNames: cart_id
            constraintName: fk_cart_item_cart
            referencedTableName: carts
            referencedColumnNames: id

        - addForeignKeyConstraint:
            baseTableName: cart_items
            baseColumnNames: product_id
            constraintName: fk_cart_item_product
            referencedTableName: products
            referencedColumnNames: id

        - createIndex:
            indexName: idx_cart_items_cart
            tableName: cart_items
            columns:
              - column:
                  name: cart_id
                  type: UUID
  - changeSet:
      id: alter-carts-table-for-guest
      author: dev
      changes:
        - addColumn:
            tableName: carts
            columns:
              - column:
                  name: guest_id
                  type: UUID
        - dropNotNullConstraint:
            tableName: carts
            columnName: user_id
            columnDataType: UUID